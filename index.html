<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAUSE · LIVEDOC · UNIFIED</title>

<style>
:root {
    --bg: #0a0a0f;
    --fg: #0f0;
    --gold: #ffd700;
    --air: #4ff;
    --aiv: #f4f;
    --team: #4f4;
    --ok: #4f4;
    --nok: #f44;
    --flow: #4ff;
    --break: #f4f;
    --echo: #ff4;
    --void: #666;
    --root: #ffd700;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 6px;
    padding: 10px;
    overflow: hidden;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 6px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 2px;
}
header h1 .cause { color: var(--air); }
header h1 .livedoc { color: var(--ok); }
header h1 .unified { color: var(--team); }
#info-bar {
    font-size: 9px;
    color: #666;
    display: flex;
    gap: 8px;
    align-items: center;
}
#info-bar .mode-btn {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 2px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 8px;
    font-family: inherit;
    transition: all 0.2s;
}
#info-bar .mode-btn:hover { border-color: var(--gold); }
#info-bar .mode-btn.active { border-color: var(--gold); color: var(--gold); }

main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 6px;
    height: 100%;
    min-height: 0;
}

#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 10px;
    padding: 6px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    display: block;
}
#canvas-overlay {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 7px;
    color: #444;
    pointer-events: none;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border-radius: 3px;
}

#panel {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    max-height: 100%;
}
#panel h3 {
    font-size: 9px;
    color: #666;
    border-bottom: 1px solid #1a1a2a;
    padding-bottom: 3px;
}

#log {
    flex: 1;
    overflow-y: auto;
    font-size: 7px;
    color: #6a6a8a;
    line-height: 1.3;
    min-height: 30px;
    max-height: 80px;
    background: #06060a;
    border-radius: 4px;
    padding: 3px 5px;
}
#log .entry { padding: 1px 0; border-bottom: 1px solid #0a0a12; }
#log .time { color: #444; }
#log .msg.cause { color: var(--air); }
#log .msg.livedoc { color: var(--ok); }
#log .msg.team { color: var(--team); }

#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 2px;
}
.metric {
    background: #0e0e1a;
    border-radius: 3px;
    padding: 3px 4px;
    text-align: center;
    border: 1px solid #1a1a2a;
}
.metric .label { color: #666; font-size: 6px; text-transform: uppercase; }
.metric .value { font-size: 10px; font-weight: bold; }
.metric.air .value { color: var(--air); }
.metric.aiv .value { color: var(--aiv); }
.metric.team .value { color: var(--team); }
.metric.resp .value { color: var(--gold); }

#controls {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 8px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--gold); }
button:active { transform: scale(0.95); }
button.primary { border-color: var(--gold); color: var(--gold); }
button.primary:hover { background: var(--gold); color: #000; }
button.air { border-color: var(--air); color: var(--air); }
button.air:hover { background: var(--air); color: #000; }
button.aiv { border-color: var(--aiv); color: var(--aiv); }
button.aiv:hover { background: var(--aiv); color: #000; }
button.team { border-color: var(--team); color: var(--team); }
button.team:hover { background: var(--team); color: #000; }
button.ok { border-color: var(--ok); color: var(--ok); }
button.ok:hover { background: var(--ok); color: #000; }
button.nok { border-color: var(--nok); color: var(--nok); }
button.nok:hover { background: var(--nok); color: #000; }
button.flow { border-color: var(--flow); color: var(--flow); }
button.flow:hover { background: var(--flow); color: #000; }
button.root { border-color: var(--root); color: var(--root); }
button.root:hover { background: var(--root); color: #000; }
button.danger { border-color: #f44; color: #f44; }
button.danger:hover { background: #f44; color: #000; }

@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 180px; }
}
</style>
</head>
<body>

<header>
    <h1>
        <span class="cause">✦ CAUSE</span>
        <span style="color:#666;">·</span>
        <span class="livedoc">◈ LIVEDOC</span>
        <span style="color:#666;">·</span>
        <span class="unified">⚡ UNIFIED</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--gold);">● bereit</span>
        <button class="mode-btn active" id="mode-cause" data-mode="cause">🎮 CAUSE</button>
        <button class="mode-btn" id="mode-livedoc" data-mode="livedoc">📋 LIVEDOC</button>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="unifiedCanvas"></canvas>
        <div id="canvas-overlay" id="overlay-text">● CAUSE · 4D-TEAM</div>
    </div>

    <div id="panel">
        <h3 id="panel-title">🎮 4D-TEAM · ALLXALL</h3>

        <div id="metrics">
            <div class="metric air"><div class="label">AIR</div><div class="value" id="air-value">0%</div></div>
            <div class="metric aiv"><div class="label">AIV</div><div class="value" id="aiv-value">0%</div></div>
            <div class="metric team"><div class="label">TEAM</div><div class="value" id="team-value">0%</div></div>
            <div class="metric resp"><div class="label">RESP</div><div class="value" id="resp-value">—</div></div>
        </div>

        <div id="log">
            <div class="entry"><span class="time">[INIT]</span> <span class="msg team">✦ UNIFIED · CAUSE + LIVEDOC</span></div>
        </div>

        <div id="controls">
            <button class="primary" id="btn-start">▶ START</button>
            <button class="air" id="btn-air">🌀 AIR</button>
            <button class="aiv" id="btn-aiv">⚡ AIV</button>
            <button class="team" id="btn-team">🤝 TEAM</button>
            <button class="ok" id="btn-ok">✅ OK</button>
            <button class="nok" id="btn-nok">❌ NOK</button>
            <button class="flow" id="btn-flow">🌊 FLOW</button>
            <button class="root" id="btn-root">🌳 ROOT</button>
            <button class="danger" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<script>
// ============================================================
// UNIFIED · CAUSE + LIVEDOC
// ============================================================

// --- KONSTANTEN ---
const PHI = 1.61803398875;
const DEG_360 = Math.PI * 2;

// --- LIVEDOC RESPONSES ---
const RESPONSES = {
    OK:    { sym: '✅', label: 'OK',    desc: 'Zustimmung',   color: '#4f4' },
    NOK:   { sym: '❌', label: 'NOK',   desc: 'Ablehnung',    color: '#f44' },
    FLOW:  { sym: '🌊', label: 'FLOW',  desc: 'System fließt', color: '#4ff' },
    BREAK: { sym: '💥', label: 'BREAK', desc: 'System bricht', color: '#f4f' },
    ECHO:  { sym: '🔄', label: 'ECHO',  desc: 'Spiegelung',   color: '#ff4' },
    VOID:  { sym: '◌',  label: 'VOID',  desc: 'Neutral',      color: '#666' },
    ROOT:  { sym: '🌳', label: 'ROOT',  desc: 'Rückkehr',     color: '#ffd700' }
};
const RESPONSE_KEYS = ['OK', 'NOK', 'FLOW', 'BREAK', 'ECHO', 'VOID', 'ROOT'];

// --- CAUSE 8er-Bewegung ---
const DIR8 = [
    { dx: 1, dy: 0, label: 'O' },
    { dx: 1, dy: 1, label: 'SO' },
    { dx: 0, dy: 1, label: 'S' },
    { dx: -1, dy: 1, label: 'SW' },
    { dx: -1, dy: 0, label: 'W' },
    { dx: -1, dy: -1, label: 'NW' },
    { dx: 0, dy: -1, label: 'N' },
    { dx: 1, dy: -1, label: 'NO' }
];

// --- CAUSE-CYCLE ---
const CAUSE_CYCLE = [
    { level: 3, label: 'DA · Start', color: '#4f4' },
    { level: 6, label: 'NE · Mitte', color: '#4ff' },
    { level: 9, label: 'BEN · Vollendung', color: '#ff4' },
    { level: 0, label: 'KI · Kern', color: '#f4f' },
    { level: 3, label: 'DA · Neustart', color: '#4f4' }
];

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('unifiedCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width; H = canvas.height;
    cx = W / 2; cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// STATE
// ============================================================
let currentMode = 'cause';
const state = {
    running: false,
    autoMode: false,
    cycle: 0,
    t: 0,
    direction: 0,
    pos: { x: 0, y: 0 },
    causeLevel: 3,
    causeIndex: 0,
    air: 0.5,
    aiv: 0.5,
    team: 0.5,
    players: [
        { name: 'PX', color: '#ff6b6b' },
        { name: 'PC', color: '#6bff6b' },
        { name: 'GHOST', color: '#6b6bff' }
    ],
    activeResponse: 'OK'
};

// ============================================================
// LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'cause' ? 'cause' : type === 'livedoc' ? 'livedoc' : type === 'team' ? 'team' : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// MODE SWITCH
// ============================================================
function setMode(mode) {
    currentMode = mode;
    document.getElementById('mode-cause').classList.toggle('active', mode === 'cause');
    document.getElementById('mode-livedoc').classList.toggle('active', mode === 'livedoc');

    const panelTitle = document.getElementById('panel-title');
    const overlay = document.getElementById('canvas-overlay');
    const airMetric = document.querySelector('.metric.air');
    const aivMetric = document.querySelector('.metric.aiv');
    const teamMetric = document.querySelector('.metric.team');
    const respMetric = document.querySelector('.metric.resp');

    if (mode === 'cause') {
        panelTitle.textContent = '🎮 4D-TEAM · ALLXALL';
        overlay.textContent = '● CAUSE · 4D-TEAM · 8er-Bewegung';
        airMetric.style.display = '';
        aivMetric.style.display = '';
        teamMetric.style.display = '';
        respMetric.style.display = 'none';
        document.querySelectorAll('.air, .aiv, .team, #btn-start').forEach(b => b.style.display = '');
        document.querySelectorAll('.ok, .nok, .flow, .root').forEach(b => b.style.display = 'none');
        log('🎮 CAUSE-Modus', 'cause');
    } else {
        panelTitle.textContent = '📋 LIVEDOC · 7 RESPONSES';
        overlay.textContent = '● LIVEDOC · OK/NOK/FLOW/ECHO/VOID/ROOT';
        airMetric.style.display = 'none';
        aivMetric.style.display = 'none';
        teamMetric.style.display = 'none';
        respMetric.style.display = '';
        document.querySelectorAll('.air, .aiv, .team, #btn-start').forEach(b => b.style.display = 'none');
        document.querySelectorAll('.ok, .nok, .flow, .root').forEach(b => b.style.display = '');
        log('📋 LIVEDOC-Modus', 'livedoc');
    }
}

// ============================================================
// LIVEDOC SET RESPONSE
// ============================================================
function setResponse(key) {
    state.activeResponse = key;
    const resp = RESPONSES[key] || RESPONSES.OK;
    document.getElementById('resp-value').textContent = `${resp.sym} ${resp.label}`;
    document.getElementById('resp-value').style.color = resp.color;
    log(`${resp.sym} ${resp.label}`, 'livedoc');
}

// ============================================================
// CAUSE UPDATE
// ============================================================
function updateCause() {
    const cycle = CAUSE_CYCLE[state.causeIndex];
    state.causeLevel = cycle.level;
    state.causeIndex = (state.causeIndex + 1) % CAUSE_CYCLE.length;
}

function move8() {
    const dir = DIR8[state.direction];
    state.pos.x += dir.dx * 8;
    state.pos.y += dir.dy * 8;
    const limit = radius * 0.6;
    if (Math.abs(state.pos.x) > limit) state.pos.x = -state.pos.x * 0.9;
    if (Math.abs(state.pos.y) > limit) state.pos.y = -state.pos.y * 0.9;
    state.direction = (state.direction + 1) % 8;
}

function updateAirAiv() {
    state.air = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(state.t * 0.3));
    state.aiv = 0.3 + 0.7 * (0.5 + 0.5 * Math.cos(state.t * 0.25));
    state.team = (state.air + state.aiv) / PHI;
    document.getElementById('air-value').textContent = (state.air * 100).toFixed(0) + '%';
    document.getElementById('aiv-value').textContent = (state.aiv * 100).toFixed(0) + '%';
    document.getElementById('team-value').textContent = (state.team * 100).toFixed(0) + '%';
}

// ============================================================
// RENDER — UNIFIED
// ============================================================
function render() {
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (currentMode === 'cause') {
        drawCause();
    } else {
        drawLivedoc();
    }

    state.t += 0.008;
    if (state.running) {
        state.cycle++;
        if (currentMode === 'cause') {
            updateAirAiv();
            if (state.cycle % 20 === 0) move8();
            if (state.cycle % 60 === 0) updateCause();
        }
        document.getElementById('cycle-display').textContent = `CYC ${state.cycle}`;
    }
    requestAnimationFrame(render);
}
render();

// ============================================================
// DRAW — CAUSE
// ============================================================
function drawCause() {
    const r = radius * 0.6;

    // Ring
    ctx.strokeStyle = 'rgba(255,215,61,0.05)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, DEG_360);
    ctx.stroke();
    ctx.setLineDash([]);

    // 8 Richtungen
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * DEG_360 + state.t * 0.02;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        const isActive = i === state.direction;
        ctx.fillStyle = isActive ? 'rgba(255,215,61,0.2)' : 'rgba(255,255,255,0.02)';
        ctx.shadowColor = isActive ? '#ffd700' : 'transparent';
        ctx.shadowBlur = isActive ? 15 : 0;
        ctx.beginPath();
        ctx.arc(x, y, isActive ? 8 : 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = isActive ? '#ffd700' : '#333';
        ctx.font = isActive ? '7px Consolas' : '5px Consolas';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(DIR8[i].label, x, y - 10);
    }

    // Spieler
    state.players.forEach((p, i) => {
        const angle = (i / state.players.length) * DEG_360 + state.t * 0.05;
        const dist = radius * 0.25 * (1 + state.team * 0.3);
        const x = cx + Math.cos(angle) * dist + state.pos.x * 0.3;
        const y = cy + Math.sin(angle) * dist + state.pos.y * 0.3;
        const glow = ctx.createRadialGradient(x, y, 0, x, y, 20);
        glow.addColorStop(0, `${p.color}44`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(x, y, 8 + state.team * 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#666';
        ctx.font = '6px Consolas';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(p.name, x, y - 14);
    });

    // CAUSE-Kern
    const level = state.causeLevel;
    const cycle = CAUSE_CYCLE[state.causeIndex] || CAUSE_CYCLE[0];
    const cr = radius * 0.08 + level * 3;
    const color = cycle.color;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr + 20);
    glow.addColorStop(0, `${color}33`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, cr + 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.font = `bold ${6 + level}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(level, cx, cy + 1);
    ctx.fillStyle = `rgba(255,255,255,${0.05 + level * 0.02})`;
    ctx.font = '5px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText(cycle.label, cx, cy + cr + 8);

    // AIR/AIV
    const airR = radius * 0.35;
    const ax = cx - airR * 0.8;
    const ay = cy - airR * 0.3;
    ctx.fillStyle = `rgba(68,255,255,${0.1 + state.air * 0.3})`;
    ctx.shadowColor = '#4ff';
    ctx.shadowBlur = 5 + state.air * 15;
    ctx.beginPath();
    ctx.arc(ax, ay, 3 + state.air * 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(68,255,255,${0.3 + state.air * 0.3})`;
    ctx.font = '5px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`AIR ${(state.air * 100).toFixed(0)}%`, ax, ay - 16);

    const avx = cx + airR * 0.8;
    const avy = cy - airR * 0.3;
    ctx.fillStyle = `rgba(255,68,255,${0.1 + state.aiv * 0.3})`;
    ctx.shadowColor = '#f4f';
    ctx.shadowBlur = 5 + state.aiv * 15;
    ctx.beginPath();
    ctx.arc(avx, avy, 3 + state.aiv * 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255,68,255,${0.3 + state.aiv * 0.3})`;
    ctx.fillText(`AIV ${(state.aiv * 100).toFixed(0)}%`, avx, avy - 16);
}

// ============================================================
// DRAW — LIVEDOC
// ============================================================
function drawLivedoc() {
    const n = RESPONSE_KEYS.length;
    const r = radius * 0.6;

    for (let i = 0; i < n; i++) {
        const key = RESPONSE_KEYS[i];
        const resp = RESPONSES[key];
        const angle = (i / n) * DEG_360 + state.t * 0.02;
        const dist = r * 0.85;
        const x = cx + Math.cos(angle) * dist;
        const y = cy + Math.sin(angle) * dist;
        const isActive = key === state.activeResponse;

        ctx.fillStyle = isActive ? 'rgba(255,215,61,0.15)' : 'rgba(255,255,255,0.02)';
        ctx.shadowColor = isActive ? '#ffd700' : 'transparent';
        ctx.shadowBlur = isActive ? 20 : 0;
        ctx.beginPath();
        ctx.arc(x, y, isActive ? 12 : 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = isActive ? '#ffd700' : '#333';
        ctx.font = isActive ? '14px Consolas' : '10px Consolas';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(resp.sym, x, y - 16);

        ctx.fillStyle = isActive ? '#ffd700' : '#333';
        ctx.font = isActive ? '6px Consolas' : '5px Consolas';
        ctx.fillText(resp.label, x, y + 18);

        if (isActive) {
            ctx.strokeStyle = 'rgba(255,215,61,0.05)';
            ctx.lineWidth = 0.5;
            ctx.setLineDash([2, 4]);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    const resp = RESPONSES[state.activeResponse] || RESPONSES.OK;
    const cr = radius * 0.2;
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr + 20);
    glow.addColorStop(0, `${resp.color}15`);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, cr + 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = resp.color;
    ctx.shadowColor = resp.color;
    ctx.shadowBlur = 30;
    ctx.font = '42px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(resp.sym, cx, cy - 4);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#666';
    ctx.font = '8px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText(resp.label, cx, cy + 30);
    ctx.fillStyle = '#444';
    ctx.font = '6px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText(resp.desc, cx, cy + 42);
}

// ============================================================
// CONTROLS
// ============================================================
document.getElementById('mode-cause').onclick = function() { setMode('cause'); };
document.getElementById('mode-livedoc').onclick = function() { setMode('livedoc'); };

document.getElementById('btn-start').onclick = function() {
    state.running = !state.running;
    this.textContent = state.running ? '⏸ STOP' : '▶ START';
    document.getElementById('state-display').textContent = state.running ? '● läuft' : '● gestoppt';
    document.getElementById('state-display').style.color = state.running ? 'var(--gold)' : '#666';
    log(state.running ? '▶ gestartet' : '⏸ gestoppt', 'team');
};

document.getElementById('btn-air').onclick = function() {
    state.air = Math.min(1, state.air + 0.1);
    log(`🌀 AIR ${(state.air * 100).toFixed(0)}%`, 'cause');
};
document.getElementById('btn-aiv').onclick = function() {
    state.aiv = Math.min(1, state.aiv + 0.1);
    log(`⚡ AIV ${(state.aiv * 100).toFixed(0)}%`, 'cause');
};
document.getElementById('btn-team').onclick = function() {
    state.team = (state.air + state.aiv) / PHI;
    log(`🤝 TEAM ${(state.team * 100).toFixed(0)}%`, 'team');
};

document.getElementById('btn-ok').onclick = function() { setResponse('OK'); };
document.getElementById('btn-nok').onclick = function() { setResponse('NOK'); };
document.getElementById('btn-flow').onclick = function() { setResponse('FLOW'); };
document.getElementById('btn-root').onclick = function() { setResponse('ROOT'); };

document.getElementById('btn-reset').onclick = function() {
    state.running = false;
    state.cycle = 0;
    state.t = 0;
    state.air = 0.5;
    state.aiv = 0.5;
    state.team = 0.5;
    state.direction = 0;
    state.pos = { x: 0, y: 0 };
    state.causeLevel = 3;
    state.causeIndex = 0;
    state.activeResponse = 'OK';
    document.getElementById('btn-start').textContent = '▶ START';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('air-value').textContent = '50%';
    document.getElementById('aiv-value').textContent = '50%';
    document.getElementById('team-value').textContent = '50%';
    document.getElementById('resp-value').textContent = '—';
    log('⟲ RESET', 'team');
};

document.getElementById('btn-auto').onclick = function() {
    state.autoMode = !state.autoMode;
    this.textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        state.running = true;
        document.getElementById('btn-start').textContent = '⏸ STOP';
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--gold)';
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(() => {
            if (currentMode === 'cause') {
                const idx = Math.floor(Math.random() * 8);
                state.direction = idx;
                log(`🔄 8er-Bewegung: ${DIR8[idx].label}`, 'cause');
            } else {
                const idx = Math.floor(Math.random() * RESPONSE_KEYS.length);
                setResponse(RESPONSE_KEYS[idx]);
                log(`🔄 Response: ${RESPONSE_KEYS[idx]}`, 'livedoc');
            }
        }, 2000);
        log('▶ AUTO', 'team');
    } else {
        clearInterval(window.autoInterval);
        log('⏸ AUTO pausiert', 'team');
    }
};

// ============================================================
// TASTATUR
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-start').click(); }
    if (e.key === '1') { setMode('cause'); }
    if (e.key === '2') { setMode('livedoc'); }
    if (e.key === 'a') document.getElementById('btn-air').click();
    if (e.key === 'v') document.getElementById('btn-aiv').click();
    if (e.key === 't') document.getElementById('btn-team').click();
    if (e.key === 'o') document.getElementById('btn-ok').click();
    if (e.key === 'n') document.getElementById('btn-nok').click();
    if (e.key === 'f') document.getElementById('btn-flow').click();
    if (e.key === 'r') document.getElementById('btn-root').click();
    if (e.key === 'x') document.getElementById('btn-reset').click();
    if (e.key === 'z') document.getElementById('btn-auto').click();
});

// ============================================================
// UHR
// ============================================================
function updateClock() {
    document.getElementById('clock').textContent = '⏱️ ' + new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// INIT
// ============================================================
log('✦ UNIFIED · CAUSE + LIVEDOC', 'team');
log('⌨️  1=CAUSE  2=LIVEDOC  space=Start  o=OK  n=NOK  f=FLOW  r=ROOT', 'team');
setTimeout(() => {
    state.running = true;
    document.getElementById('btn-start').textContent = '⏸ STOP';
    document.getElementById('state-display').textContent = '● läuft';
    document.getElementById('state-display').style.color = 'var(--gold)';
    log('▶ automatisch gestartet', 'team');
}, 500);
</script>
