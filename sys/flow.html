
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 FLOW · System fließt · 4u</title>
    <style>
        :root { --bg: #0a0a0f; --fg: #0f0; --flow: #4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Consolas', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            background-image: radial-gradient(ellipse at center, rgba(68,255,255,0.05) 0%, transparent 70%);
        }
        .response { font-size: 80px; animation: flow 3s ease-in-out infinite; }
        @keyframes flow {
            0%, 100% { transform: translateX(-10px); opacity: 0.8; }
            50% { transform: translateX(10px); opacity: 1; }
        }
        h1 { color: var(--flow); font-size: 32px; letter-spacing: 4px; }
        .desc { color: #666; font-size: 14px; }
        .back { color: #444; text-decoration: none; border: 1px solid #333; padding: 8px 20px; border-radius: 20px; transition: 0.3s; }
        .back:hover { border-color: var(--flow); color: var(--flow); }
        .meta { color: #333; font-size: 12px; margin-top: 20px; }
        .flow-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: repeating-linear-gradient(45deg, rgba(68,255,255,0.02) 0px, rgba(68,255,255,0.02) 20px, transparent 20px, transparent 40px);
        }
    </style>
</head>
<body>
    <div class="flow-bg"></div>
    <div class="response">🌊</div>
    <h1>FLOW · System fließt</h1>
    <p class="desc">Das System befindet sich im kontinuierlichen Fluss.</p>
    <a href="../index.html" class="back">← Zurück zu 4u</a>
    <div class="meta">4u · Response Layer 7 · © iki1uc wieimmer</div>
    <script>
        console.log('🌊 FLOW · System fließt · 4u');
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.location.href = '../index.html';
        });
    </script>
</body>
</html>
